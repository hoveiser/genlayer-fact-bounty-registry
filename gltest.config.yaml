# GenLayer integration-test / gltest configuration.
#
# Deliberately contains NO private keys: `gltest` expects literal keys in
# `networks.<net>.accounts`, and this file is committed. The integration test and
# the end-to-end script therefore build their client/account directly from the
# GENLAYER_PRIVATE_KEY environment variable via `genlayer_py.create_account`
# instead of going through gltest's config-driven `get_gl_client()`.
networks:
  default: studionet
  studionet:
    url: https://studio.genlayer.com/api
    chain_type: studionet
    # studionet finalisation is slow; the defaults (3 s x 50) are too tight.
    default_wait_interval: 6000
    default_wait_retries: 60

paths:
  contracts: contracts
  artifacts: artifacts

environment: .env
